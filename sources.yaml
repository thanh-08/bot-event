# Danh sách nguồn. Thêm/bớt nguồn ở đây, không cần sửa code.
# - Nguồn RSS: chỉ cần name + url.
# - Nguồn KHÔNG có RSS: thêm  type: html  (bot đọc trang rồi lấy các link bài viết).
# - province: tỉnh mặc định của nguồn; local: true = bài của báo địa phương, nếu bài không nêu tỉnh khác
#   thì coi sự kiện thuộc tỉnh đó.
# Ngoài ra bot tự thêm 8 nguồn Google News + 8 nguồn Bing News (mỗi tỉnh 1 truy vấn).
# Chạy `python main.py check` để biết nguồn nào đang hoạt động (nguồn LỖI hoặc 0 bài thì xóa/sửa link).
# Đã loại các nguồn không lấy được bài (VietnamPlus, VOV, cổng UBND, Sở VHTTDL, Ticketbox, VinWonders, Klook, Trip.com).
