name: event-bot

on:
  schedule:
    # Lệch khỏi đầu giờ/giữa giờ vì GitHub hay trễ hoặc bỏ lượt vào các phút :00 và :30.
    - cron: "17,47 * * * *"    # mỗi 30 phút
    - cron: "3 0 * * *"        # 07:03 giờ Việt Nam (bản tin sáng)
    - cron: "33 0 * * *"       # 07:33 giờ Việt Nam (dự phòng nếu lượt trên bị trễ)
  workflow_dispatch:           # cho phép bấm chạy tay, hoặc gọi từ dịch vụ hẹn giờ bên ngoài (cron-job.org)

permissions:
  contents: write

concurrency:
  group: event-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chạy bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py run
      - name: Lưu cơ sở dữ liệu
        if: always()
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add data/events.db
          git diff --cached --quiet || (git commit -m "cập nhật dữ liệu" && git push)
