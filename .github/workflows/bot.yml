name: event-bot

on:
  schedule:
    # Lệch khỏi đầu giờ/giữa giờ vì GitHub hay trễ hoặc bỏ lượt vào các phút :00 và :30.
    - cron: "17,47 * * * *"    # mỗi 30 phút
    - cron: "3 0 * * *"        # 07:03 giờ Việt Nam (bản tin sáng)
    - cron: "33 0 * * *"       # 07:33 giờ Việt Nam (dự phòng nếu lượt trên bị trễ)
  workflow_dispatch:           # bấm chạy tay, cron-job.org, hoặc Cloudflare Worker gọi (lệnh /excel)
    inputs:
      chat_id: {description: "Worker điền: chat nhận file Excel", required: false, default: ""}
      text: {description: "Worker điền: nội dung lệnh /excel", required: false, default: ""}

permissions:
  contents: write

concurrency:
  group: event-bot-${{ inputs.chat_id != '' && 'excel' || 'run' }}   # /excel không phải xếp hàng sau lượt thu thập
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chạy bot
        env:
          CMD_TEXT: ${{ inputs.text }}
          CHAT_ID: ${{ inputs.chat_id }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_WEBHOOK: "1"                       # lệnh do Cloudflare Worker trả lời, Actions không đọc getUpdates nữa
        run: |
          if [ -n "$CHAT_ID" ]; then python main.py reply "$CHAT_ID" "$CMD_TEXT"; else python main.py run; fi
      - name: Lưu cơ sở dữ liệu
        if: always()
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu"
            exit 0
          fi
          git commit -m "cập nhật dữ liệu"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Lần $i chưa đẩy được, thử lại..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Không lưu được dữ liệu sau 5 lần thử"
          exit 1
